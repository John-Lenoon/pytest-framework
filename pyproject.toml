[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["reports", "allure-results", "allure-report"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/run_yaml.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
