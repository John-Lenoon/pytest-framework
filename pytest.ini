# pytest global config - mall-swarm automation test framework
# NOTE: keep this file pure ASCII; pytest's iniconfig parser reads it with the
# Windows locale encoding (GBK) and Chinese comments would raise UnicodeDecodeError.
[pytest]
# framework root on sys.path, so tests/ can import config/ utils/ fixtures/ data/
pythonpath = .
testpaths = tests
addopts = -v --strict-markers --tb=short --html=reports/report.html --self-contained-html

# case grouping markers (by business module + scenario type)
markers =
    login: login/auth cases (portal member / admin / unified auth)
    product: product browse and detail cases
    search: search cases (portal MySQL search + ES search service)
    cart: cart cases
    order: order cases
    es: cases depending on Elasticsearch (module-level skip when ES down, not mocked)
    flow: cross-api business flow cases (cart -> confirm order -> order -> pay -> cancel)
    smoke: the core case of each module
    permission: authz cases (no token 401 / invalid token)
    validation: parameter validation cases (missing/invalid params)
    boundary: boundary value cases (min/max)
    framework: offline tests for the YAML execution engine
    mock: tests using the isolated Flask mock server
    database: cases that compare API responses with MySQL query results

# coverage only counts framework support code (the target is the real API)
# usage: pytest --cov=utils --cov=fixtures --cov=config --cov-report=term-missing
